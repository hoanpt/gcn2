# Nixpacks configuration for Coolify / Railway deployment

[variables]
HOSTNAME = "0.0.0.0"
PORT = "3000"
NODE_ENV = "production"

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "npm run build",
  "cp -R public .next/standalone/public",
  "cp -R .next/static .next/standalone/.next/static"
]

[start]
cmd = "HOSTNAME=0.0.0.0 PORT=3000 node .next/standalone/server.js"
