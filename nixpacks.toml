# Nixpacks configuration for Coolify / Railway deployment

[phases.setup]
nixPkgs = ["python3", "gcc", "gnumake"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "npm run build",
  "cp -R public .next/standalone/public",
  "cp -R .next/static .next/standalone/.next/static"
]

[start]
cmd = "node .next/standalone/server.js"
